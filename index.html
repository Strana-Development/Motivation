<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личная мотивация — тест</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e0f2fe 100%);
    background-attachment: fixed;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 24px 60px -24px rgba(30, 41, 59, .28),
                0 4px 14px rgba(30, 41, 59, .06);
    animation: cardIn .5s cubic-bezier(.2, .8, .3, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Шапка ---------- */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .brand-icon {
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 8px 18px -8px rgba(99, 102, 241, .9);
  }

  .brand h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: -.2px;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 13px;
    color: #64748b;
  }

  /* ---------- Прогресс ---------- */
  .progress-wrap { margin-bottom: 26px; }

  .progress-track {
    height: 6px;
    border-radius: 999px;
    background: #eef2f7;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    transition: width .45s cubic-bezier(.4, 0, .2, 1);
  }

  .progress-text {
    margin-top: 9px;
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }

  /* ---------- Сцена с плавной сменой ---------- */
  #stage {
    transition: opacity .3s ease, transform .3s ease;
  }

  #stage.hidden {
    opacity: 0;
    transform: translateY(16px);
  }

  /* ---------- Вопрос ---------- */
  .q-title {
    margin: 0 0 20px;
    font-size: 19px;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: -.2px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-align: left;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.4;
    color: inherit;
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease,
                transform .15s ease, box-shadow .2s ease;
  }

  .option:hover {
    border-color: #c7d2fe;
    background: #f8faff;
    transform: translateY(-1px);
  }

  .option.selected {
    border-color: #6366f1;
    background: #eef2ff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .12);
  }

  .marker {
    width: 32px;
    height: 32px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: #f1f5f9;
    color: #475569;
    font-weight: 600;
    font-size: 14px;
    transition: background .2s ease, color .2s ease;
  }

  .option.selected .marker {
    background: #6366f1;
    color: #fff;
  }

  .actions { margin-top: 22px; }

  .btn-primary {
    width: 100%;
    padding: 15px 28px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -10px rgba(99, 102, 241, .75);
  }

  .btn-primary:active:not(:disabled) { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- Результат ---------- */
  .result { text-align: center; }

  .ring {
    width: 152px;
    height: 152px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .7s ease;
  }

  .ring-inner {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 10px rgba(15, 23, 42, .06);
  }

  .ring-num {
    font-size: 30px;
    font-weight: 700;
    color: #4f46e5;
    line-height: 1;
  }

  .ring-label {
    margin-top: 4px;
    font-size: 12px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .result-title {
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: -.3px;
  }

  .result-sub {
    margin: 0 0 24px;
    font-size: 15px;
    color: #64748b;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 26px;
  }

  .stat {
    padding: 18px 12px;
    border-radius: 16px;
    border: 2px solid transparent;
  }

  .stat-ok { background: #ecfdf5; border-color: #a7f3d0; }
  .stat-no { background: #fef2f2; border-color: #fecaca; }

  .stat-num {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .stat-ok .stat-num { color: #059669; }
  .stat-no .stat-num { color: #dc2626; }

  .stat-label {
    margin-top: 6px;
    font-size: 13px;
    color: #64748b;
  }

  .review {
    text-align: left;
    max-height: 250px;
    overflow-y: auto;
    padding-right: 6px;
    margin-bottom: 24px;
  }

  .review::-webkit-scrollbar { width: 6px; }
  .review::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 999px;
  }

  .review-item {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: #f8fafc;
    border-left: 4px solid #cbd5e1;
    font-size: 14px;
  }

  .review-item.ok { border-left-color: #34d399; }
  .review-item.no { border-left-color: #f87171; }

  .review-icon {
    font-size: 15px;
    line-height: 1.5;
    flex: none;
  }

  .review-item.ok .review-icon { color: #059669; }
  .review-item.no .review-icon { color: #dc2626; }

  .review-q {
    font-weight: 600;
    color: #334155;
    margin-bottom: 3px;
  }

  .review-a {
    color: #64748b;
    line-height: 1.5;
  }

  /* ---------- Мобильные ---------- */
  @media (max-width: 520px) {
    body { padding: 14px; }
    .card { padding: 22px 18px; border-radius: 20px; }
    .q-title { font-size: 17px; }
    .option { font-size: 14.5px; padding: 14px; }
    .stats { gap: 10px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">М</div>
    <div>
      <h1>Личная мотивация</h1>
      <p class="brand-sub">Тест из 10 вопросов</p>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">Вопрос 1 из 10</div>
  </div>

  <div id="stage"></div>
</div>

<script>
  /* ==================== ДАННЫЕ ТЕСТА ==================== */
  const questions = [
    {
      q: 'Что утверждает презентация про осознание мотивации?',
      options: [
        'Мотивация обычно человеком не осознаётся',
        'Мотивация всегда полностью осознаётся человеком'
      ],
      correct: 0
    },
    {
      q: 'Почему людям сложно обсуждать тему мотивации между собой?',
      options: [
        'Потому что у большинства нет единого понятийного аппарата для разговора о мотивации',
        'Потому что тема мотивации запрещена в организациях'
      ],
      correct: 0
    },
    {
      q: 'Сколько факторов оценивает опросник DEEP Drivers?',
      options: ['15 факторов', '10 факторов'],
      correct: 0
    },
    {
      q: 'На сколько блоков сгруппированы факторы в опроснике?',
      options: ['3 блока', '5 блоков'],
      correct: 1
    },
    {
      q: 'Какой фактор относится к блоку «Уважение»?',
      options: ['Признание', 'Деньги'],
      correct: 0
    },
    {
      q: 'Какой фактор входит в блок «Условия»?',
      options: ['Творчество', 'Стабильность'],
      correct: 1
    },
    {
      q: 'Что означает фактор «Осведомлённость»?',
      options: [
        'Ясность и понимание своей роли в организации, поставленных целей и задач',
        'Знакомство с новыми людьми и расширение сети контактов'
      ],
      correct: 0
    },
    {
      q: 'Что описывает фактор «Сопричастность»?',
      options: [
        'Ощущение собственной причастности к важному делу, значимому событию',
        'Комфортные условия работы и баланс между работой и личными потребностями'
      ],
      correct: 0
    },
    {
      q: 'Какой фактор в презентации значился ведущим мотиватором с показателем 92 балла в индивидуальном отчёте?',
      options: ['Управление', 'Деньги'],
      correct: 0
    },
    {
      q: 'Что рекомендуют «простые» правила мотивации работодателям?',
      options: [
        'Не обещать человеку при найме или продвижении того, чего не можете дать',
        'Всегда предлагать только денежную мотивацию всем сотрудникам'
      ],
      correct: 0
    }
  ];

  /* ==================== СОСТОЯНИЕ ==================== */
  const stage        = document.getElementById('stage');
  const progressBar  = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  let current        = 0;
  let selectedOption = null;
  const answers      = new Array(questions.length).fill(null);

  /* ==================== ПЛАВНЫЙ ПЕРЕХОД ==================== */
  function swap(renderFn) {
    stage.classList.add('hidden');
    setTimeout(() => {
      renderFn();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => stage.classList.remove('hidden'));
      });
    }, 300);
  }

  function setProgress(percent, label) {
    progressBar.style.width = percent + '%';
    progressText.textContent = label;
  }

  /* ==================== ВОПРОС ==================== */
  function renderQuestion() {
    const q = questions[current];
    selectedOption = answers[current];

    setProgress(
      (current / questions.length) * 100,
      'Вопрос ' + (current + 1) + ' из ' + questions.length
    );

    stage.innerHTML = `
      <h2 class="q-title">${q.q}</h2>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button type="button"
                  class="option ${selectedOption === i ? 'selected' : ''}"
                  data-index="${i}">
            <span class="marker">${i === 0 ? 'а' : 'б'}</span>
            <span class="text">${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="actions">
        <button type="button" class="btn-primary" id="nextBtn"
                ${selectedOption === null ? 'disabled' : ''}>
          ${current === questions.length - 1 ? 'Завершить' : 'Далее'}
        </button>
      </div>
    `;

    const optionButtons = stage.querySelectorAll('.option');
    const nextBtn = stage.querySelector('#nextBtn');

    optionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedOption = Number(btn.dataset.index);
        optionButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        nextBtn.disabled = false;
      });
    });

    nextBtn.addEventListener('click', () => {
      if (selectedOption === null) return;
      answers[current] = selectedOption;

      if (current === questions.length - 1) {
        swap(showResults);
      } else {
        current++;
        swap(renderQuestion);
      }
    });
  }

  /* ==================== РЕЗУЛЬТАТЫ ==================== */
  function showResults() {
    const correct = questions.reduce(
      (acc, q, i) => acc + (answers[i] === q.correct ? 1 : 0), 0
    );
    const wrong = questions.length - correct;
    const pct   = Math.round((correct / questions.length) * 100);

    setProgress(100, 'Результат');

    const reviewHTML = questions.map((q, i) => {
      const ok = answers[i] === q.correct;
      const userAnswer = answers[i] === null
        ? 'нет ответа'
        : q.options[answers[i]];

      return `
        <div class="review-item ${ok ? 'ok' : 'no'}">
          <span class="review-icon">${ok ? '✔' : '✘'}</span>
          <div>
            <div class="review-q">${i + 1}. ${q.q}</div>
            <div class="review-a">
              Ваш ответ: ${userAnswer}
              ${ok ? '' : '<br>Верный ответ: ' + q.options[q.correct]}
            </div>
          </div>
        </div>
      `;
    }).join('');

    stage.innerHTML = `
      <div class="result">
        <div class="ring" style="background: conic-gradient(#6366f1 0% ${pct}%, #e2e8f0 ${pct}% 100%)">
          <div class="ring-inner">
            <span class="ring-num">${pct}%</span>
            <span class="ring-label">верно</span>
          </div>
        </div>

        <h2 class="result-title">Тест завершён</h2>
        <p class="result-sub">Вы ответили правильно на ${correct} из ${questions.length} вопросов</p>

        <div class="stats">
          <div class="stat stat-ok">
            <div class="stat-num">${correct}</div>
            <div class="stat-label">Верных ответов</div>
          </div>
          <div class="stat stat-no">
            <div class="stat-num">${wrong}</div>
            <div class="stat-label">Неверных ответов</div>
          </div>
        </div>

        <div class="review">${reviewHTML}</div>

        <button type="button" class="btn-primary" id="restartBtn">Пройти заново</button>
      </div>
    `;

    stage.querySelector('#restartBtn').addEventListener('click', () => {
      current = 0;
      answers.fill(null);
      selectedOption = null;
      swap(renderQuestion);
    });
  }

  /* ==================== СТАРТ ==================== */
  renderQuestion();
</script>

</body>
</html>
